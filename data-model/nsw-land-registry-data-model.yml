joins:
- name: search-hit to image
  path: >-
    POST /hlrv/documents/_msearch -> hits.hits[]._source.images[] -> urlencode(location + "/" +
    fileName) -> GET /hlrv/iiif/2/{identifier}/info.json -> GET
    /hlrv/iiif/2/{identifier}/{region}/{size}/{rotation}/{quality}.{format}
  note: >-
    The only complete public join in the NSW LRS estate. Recorded as an observed data model; the
    HLRV terms of use prohibit scripted or emulated access, so this path is documentation of how
    the viewer works, not a sanctioned integration route.
absent:
- >-
  No entity model is published for the Torrens Title Register itself (folio, dealing, plan,
  caveat, mortgage, lease). Those objects are reachable only through a licensed information broker
  or an ELNO workspace, and their schemas are not public.
- >-
  The register's own vocabulary is published as prose, not as a schema: 257 defined terms in
  vocabulary/nsw-land-registry-glossary.yml, and the ICSM ePlan CIF 4.0 XSD in openapi/ for plan
  lodgment.
