description: >-
  The entity graph implied by the NSW Land Registry Services surfaces that answer. There is no
  published schema for any of them, so every field below was read off a real response captured on
  2026-07-26. The historical-records model is the useful one: it shows exactly how a search hit is
  turned into an image request, which is the only end-to-end join NSW LRS leaves reachable.
identifiers:
- name: folio identifier
  domain: Torrens Title Register
  format: <lot>/<plan> — for example 1/12345 for Lot 1 in Deposited Plan 12345
  detail: >-
    The primary key of NSW land. Derived from lot and plan number and documented at
    https://nswlrs.com.au/services/record-searches/about-the-torrens-title-register. No Universal
    Property Identifier is used. Register data keyed on the folio is broker-licensed and not
    reachable through any public surface.
- name: IIIF image identifier
  domain: HLRV image service
  format: '{location}/{fileName} URL-encoded — for example eirOSD%2F0938-0939%2F0939_0937_0001.jp2'
  detail: >-
    Constructed by the HLRV client by joining the location and fileName of an images[] element from
    a search hit. This is the join between the search index and the image service.
- name: bookAndNumber
  domain: General Register of Deeds
  format: <book>-<number> — for example 939-937
  detail: The citation form for Old System deeds, echoed in imageName as "BK 939 937".
