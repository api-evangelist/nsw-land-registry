generated: '2026-07-26'
method: probed
source: >-
  live probes of the NSW LRS surfaces plus the harvested IIIF image information document, the ePlan
  CIF XSD and the published NSW LRS pages
description: >-
  Which industry and cross-cutting standards the reachable NSW Land Registry Services surfaces
  actually conform to. NSW LRS makes no conformance claims of its own; every assertion below is
  evidenced by a document it publishes or a response it returned.
standards:
- id: iiif-image-api-2.0-level2
  name: IIIF Image API 2.0, compliance level 2
  conforms: true
  evidence: >-
    The harvested image information document at
    openapi/nsw-land-registry-hlrv-iiif-image-information.json declares profile
    http://iiif.io/api/image/2/level2.json, @context http://iiif.io/api/image/2/context.json and
    protocol http://iiif.io/api/image, with the full Level 2 feature list (regionByPx, regionByPct,
    regionSquare, sizeByW, sizeByH, sizeByWh, sizeByPct, sizeByConfinedWh, sizeAboveFull,
    rotationArbitrary, rotationBy90s, mirroring, cors, jsonldMediaType, canonicalLinkHeader,
    profileLinkHeader, baseUriRedirect) and the jpg/tif/gif/png formats. Verified live again on
    2026-07-26.
  spec: https://iiif.io/api/image/2.1/
- id: json-ld
  name: JSON-LD
  conforms: true
  evidence: >-
    The IIIF image information document is JSON-LD, served with an @context and the jsonldMediaType
    feature advertised.
- id: statuspage-api-v2
  name: Atlassian Statuspage public status API v2
  conforms: true
  evidence: >-
    https://status.nswlrs.com.au/api publishes an endpoint reference for /api/v2/summary.json,
    status.json, components.json, incidents.json, incidents/unresolved.json,
    scheduled-maintenances.json and scheduled-maintenances/upcoming.json; all returned HTTP 200
    application/json anonymously on 2026-07-26 with page id jcfp2nmyt2j4.
- id: rss-2.0
  name: RSS 2.0
  conforms: true
  evidence: >-
    https://status.nswlrs.com.au/history.rss returned HTTP 200 application/rss+xml, 40,003 bytes,
    incident history feed.
- id: atom-1.0
  name: Atom 1.0
  conforms: true
  evidence: >-
    https://status.nswlrs.com.au/history.atom returned HTTP 200 application/atom+xml, 38,259 bytes.
- id: landxml-1.2-icsm-eplan-cif-4.0
  name: LandXML 1.2 constrained by the ICSM ePlan Cadastral Information File 4.0 vocabulary
  conforms: true
  evidence: >-
    openapi/nsw-land-registry-eplan-cif-enumerated-types-4-0.xsd is a valid W3C XML Schema,
    targetNamespace urn:xml-gov-au:nsw:icsm:eplan:cif:enumerated-types:4.0, version 4.0, 44
    xs:simpleType definitions, published as an ordinary site asset and linked from
    https://nswlrs.com.au/services/plans/digital-plans. From 1 July 2026 Deposited and Community
    plans must include a LandXML digital plan file.
- id: w3c-xml-schema
  name: W3C XML Schema (XSD 1.0)
  conforms: true
  evidence: The ePlan CIF enumerated types document is a valid xs:schema.
- id: elasticsearch-msearch
  name: Elasticsearch multi-search (ndjson) request/response shape
  conforms: true
  evidence: >-
    POST /hlrv/documents/_msearch accepts standard Elasticsearch ndjson and returns a responses[]
    array with took, timed_out, _shards and hits. Observed, not published.
- id: ecnl-nsw-participation-rules-v7
  name: Electronic Conveyancing National Law — NSW Participation Rules version 7
  conforms: true
  regulatory: true
  evidence: >-
    NSW LRS operates the register under the ECNL and conducts subscriber compliance examinations
    under delegated section 33 ECNL authority
    (https://nswlrs.com.au/services/land-property-transactions/subscriber-compliance-program); the
    Participation Rules version 7 are published by the Office of the Registrar General at
    https://www.registrargeneral.nsw.gov.au/__data/assets/pdf_file/0003/1286751/NSW-Participation-Rules-Version-7.pdf.
- id: real-property-act-1900-torrens
  name: Real Property Act 1900 (NSW) — Torrens Title Register
  conforms: true
  regulatory: true
  evidence: >-
    The register operated by NSW LRS is the statutory Torrens Title Register; the Registrar General
    retains the statutory authority and the Office of the Registrar General regulates the 1 July
    2017 concession.
- id: openapi
  name: OpenAPI / Swagger
  conforms: false
  evidence: >-
    No OpenAPI or Swagger document exists on any NSW LRS host. /openapi.json, /swagger.json,
    /api-docs, /docs and /v1/openapi.json were probed against nswlrs.com.au, api.nswlrs.com.au,
    api.lrsnative.com.au, hlrv.nswlrs.com.au, connect.nswlrs.com.au and online.nswlrs.com.au on
    2026-07-26 — all 400, 403 or 404.
- id: asyncapi
  name: AsyncAPI
  conforms: false
  evidence: No AsyncAPI document is published; the only event surface is Statuspage webhooks.
- id: graphql
  name: GraphQL
  conforms: false
  evidence: No /graphql surface exists on any host.
- id: mcp
  name: Model Context Protocol
  conforms: false
  evidence: No MCP server is published, and the HLRV terms prohibit emulated or automated access.
- id: rfc9457-problem-details
  name: RFC 9457 Problem Details for HTTP APIs
  conforms: false
  evidence: >-
    No response anywhere returned application/problem+json; errors are bare {"message":"..."}
    strings or plain text.
- id: oauth2
  name: OAuth 2.0
  conforms: false
  evidence: >-
    No /.well-known/oauth-authorization-server on any host; no OAuth flow, token endpoint or scope
    surface is published.
- id: openid-connect
  name: OpenID Connect
  conforms: false
  evidence: /.well-known/openid-configuration returned 400/403/404 on every host probed.
- id: rfc9116-security-txt
  name: RFC 9116 security.txt
  conforms: false
  evidence: /.well-known/security.txt returned 400/403/404 on all six hosts probed on 2026-07-26.
- id: rfc9727-api-catalog
  name: RFC 9727 /.well-known/api-catalog
  conforms: false
  evidence: /.well-known/api-catalog returned 400/403/404 on all six hosts probed.
- id: rfc8594-sunset-header
  name: RFC 8594 Sunset header
  conforms: false
  evidence: No Sunset or Deprecation header was observed and no deprecation policy is published.
- id: reso-web-api
  name: RESO Web API
  conforms: false
  evidence: >-
    NSW LRS appears nowhere in the RESO certified-organizations list at
    https://www.reso.org/certificates/ (HTTP 200, 416,233 bytes, zero Australian entries). Expected
    for Australia, where RESO is a North American NAR construct with no adoption.
- id: odata
  name: OData
  conforms: false
  evidence: >-
    $metadata probes returned 404 on www.nswlrs.com.au, 403 on api.nswlrs.com.au and 400 on
    api.lrsnative.com.au.
- id: reso-data-dictionary
  name: RESO Data Dictionary
  conforms: false
  evidence: >-
    The NSW jurisdictional vocabulary is the ICSM ePlan CIF / LandXML schema plus the published
    NSW LRS glossary (vocabulary/nsw-land-registry-glossary.yml), not the RESO Data Dictionary. No
    Universal Property Identifier is used; NSW keys land on the Torrens folio identifier derived
    from lot and plan number.
compliance_program:
  published: false
  detail: >-
    No trust centre, no SOC 2, ISO 27001, PCI DSS or IRAP certification claim was found on any NSW
    LRS host; probe-security-programs.py returned no verified trust-centre or vulnerability-
    disclosure hit on 2026-07-26. NSW LRS's public assurance posture is regulatory (Office of the
    Registrar General oversight, ECNL compliance) rather than a published security certification.
