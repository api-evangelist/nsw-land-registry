apis:
- aid: nsw-land-registry:nsw-lrs-hlrv-iiif-image-api
  name: NSW LRS Historical Land Records Viewer IIIF Image API
  description: >-
    A live Cantaloupe Image Server exposing the International Image
    Interoperability Framework (IIIF) Image API 2.x over the scanned NSW land
    record images behind the Historical Land Records Viewer. Verified
    anonymously on 2026-07-26: the endpoint root returned HTTP 200 with the
    Cantaloupe "IIIF Image API 2.x Endpoint" documentation page advertising the
    sample patterns /{identifier}/info.json and
    /{identifier}/full/full/0/default.jpg, an image information document for
    identifier eirOSD%2F0938-0939%2F0939_0937_0001.jp2 returned HTTP 200 with
    Content-Type application/json declaring compliance profile
    http://iiif.io/api/image/2/level2.json, and a derivative render at
    /full/200,/0/default.jpg returned HTTP 200 with Content-Type image/jpeg and
    16,798 bytes. The saved info.json is the machine-readable contract: it
    declares @context http://iiif.io/api/image/2/context.json, protocol
    http://iiif.io/api/image, the source dimensions, six pyramid sizes, tile
    geometry, the formats jpg/tif/gif/png, the qualities bitonal/default/gray/
    color and the full Level 2 feature list including cors, regionByPx,
    sizeByPct, rotationArbitrary and profileLinkHeader. Identifiers are
    constructed by the HLRV client as URL-encoded location + "/" + fileName over
    JPEG2000 masters. NSW LRS publishes no documentation for this endpoint, no
    OpenAPI, no key issuance and no rate-limit statement; it is an undocumented
    backend of a free public viewer, and the HLRV terms of use expressly
    prohibit scripted or emulated access.
  humanURL: https://hlrv.nswlrs.com.au/
