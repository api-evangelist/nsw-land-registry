- aid: nsw-land-registry:nsw-lrs-hlrv-document-search-api
  name: NSW LRS Historical Land Records Viewer Document Search API
  description: >-
    An Elasticsearch search proxy that backs the Historical Land Records Viewer
    and answers anonymously. Verified on 2026-07-26: POST
    https://api.lrsnative.com.au/hlrv/documents/_msearch with an ndjson body of
    {"preference":"probe"} plus {"query":{"match_all":{}},"size":2} returned HTTP
    200 with Content-Type application/json and hits.total 7160622 across three
    shards, with no credential of any kind supplied. The HLRV single-page app
    configures the ReactiveSearch client with ELASTIC_SEARCH_HOST
    https://api.lrsnative.com.au, INDEX_NAME hlrv/documents and an x-portal-token
    header, but that header is not enforced on _msearch. Returned documents
    carry collectionId, collectionName (for example "General Register of Deeds
    (Old System Deeds)"), documentId, documentRenderingId, imageType, imageName,
    bookAndNumber, scanTimestamp and an images array of JPEG2000 files with
    fileName, location, imageId, imageStatus, seqNo and pixel dimensions — the
    exact fields needed to build IIIF identifiers. Sibling routes are not open:
    GET /hlrv/documents returned HTTP 503, POST /hlrv/documents/_search returned
    HTTP 400 with {"message":"Invalid Request: TypeError: query.includes is not
    a function"}, and POST /hlrv/lotsearch/search returned HTTP 500. There is no
    published contract, no documentation, no versioning and no terms permitting
    programmatic use; HLRV clause 3.6 prohibits using "any device, software or
    routine to abuse the service of HLRV or emulate human interaction and
    operation" and clause 2.1 prohibits on-supply, republishing and data
    aggregation. Recorded here as an observed, reachable surface, not as an
    offered developer product.
  humanURL: https://hlrv.nswlrs.com.au/
  baseURL: https://api.lrsnative.com.au/hlrv/documents
