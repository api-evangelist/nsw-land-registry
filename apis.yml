name: NSW Land Registry Services
kind: company
description: >-
  NSW Land Registry Services (NSW LRS) operates the Torrens Title Register for
  New South Wales, Australia's largest property market, under a concession
  granted by the NSW Government on 1 July 2017 and held by Australian Registry
  Investments Pty Ltd (ACN 617 926 020) as trustee for the Australian Registry
  Investments Trust. It is a privatised operator of a public record: the
  Registrar General retains the statutory authority and the Office of the
  Registrar General regulates the concession, while NSW LRS runs the register,
  examines and registers dealings and plans, and sells access to the resulting
  data. It sits at the legal foundation of the Australian value chain, beneath
  the REA Group and Domain portal duopoly, beneath PropTrack and CoreLogic
  valuation, and beneath PEXA and Sympli, the Electronic Lodgment Network
  Operators through which every Real Property Act dealing must now be lodged.
  Its API posture is the sharpest example in this study of a registry that is
  technically modern and commercially closed. There is no developer portal, no
  developer or docs subdomain, no published API programme, no OpenAPI or Swagger
  document, no SDK, no Postman workspace, no webhook catalogue and no GitHub
  organization. Access to the register itself is gated behind a licence: the
  site states plainly that "Only an information broker we've authorised can
  access our records", and those brokers — InfoTrack, Dye & Durham, Equifax,
  CITEC Confirm, TriSearch, Landchecker, Fynd, PSI Global and others — "deliver
  and on-sell land titling and related property information through an official
  licence agreement with NSW LRS". Wholesale data products (Property Alerts,
  Lease Notifications, Mortgage Insights, Mortgage Verifications) are sold by
  emailing datasolutions@nswlrs.com.au, with no self-serve path and no published
  technical contract. What does exist, and what this profile records, are three
  genuinely reachable machine-readable surfaces that NSW LRS never advertises to
  developers: a Cantaloupe IIIF Image API 2.0 Level 2 endpoint serving the
  scanned historical land records behind the Historical Land Records Viewer, an
  anonymously callable Elasticsearch search proxy over 7,160,622 indexed
  historical documents, and a publicly downloadable W3C XML Schema for the ICSM
  ePlan Cadastral Information File enumerated types that pins the NSW LandXML
  jurisdictional vocabulary now mandatory for digital plan lodgment. The
  contracts are open; the licence is not — the HLRV terms of use prohibit
  on-supply, data aggregation, republishing and "any device, software or routine
  to abuse the service of HLRV or emulate human interaction and operation". RESO
  is entirely absent: NSW LRS appears nowhere in RESO's certified-organizations
  list, there is no RESO Web API or Data Dictionary certification, no OData
  $metadata document and no Universal Property Identifier, which is the expected
  answer for Australia, where RESO is a North American NAR construct with no
  adoption. No open, unlicensed dataset is published — NSW LRS is not a
  publishing organization on data.nsw.gov.au — and a privatised registry selling
  the public record back through a licensed broker channel is itself the finding.
