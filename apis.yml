- aid: nsw-land-registry:nsw-lrs-status-api
  name: NSW LRS Status API
  description: >-
    The one documented, publicly callable API NSW Land Registry Services operates. The NSW LRS
    status page at status.nswlrs.com.au is an Atlassian Statuspage (page id jcfp2nmyt2j4) with the
    public v2 API enabled and a published endpoint reference at https://status.nswlrs.com.au/api,
    which documents each route with plain curl examples and a JavaScript widget wrapper. Verified
    anonymously on 2026-07-26: /api/v2/status.json returned HTTP 200 with indicator "none" and
    description "All Systems Operational"; /api/v2/summary.json returned 12,844 bytes;
    /api/v2/components.json returned 9,376 bytes describing 27 components and component groups;
    /api/v2/incidents.json returned 163,325 bytes covering 50 incidents;
    /api/v2/scheduled-maintenances.json returned 366,516 bytes; and the unresolved and upcoming
    convenience routes both answered 200. Incident history is also published as RSS 2.0 and Atom
    1.0 feeds, and the page offers email, SMS and webhook subscriptions, the webhook fired whenever
    NSW LRS creates, updates or resolves an incident or changes a component status. The component
    list doubles as the closest public inventory of NSW LRS production systems — Secure Web
    Services, VPN, eConveyancing Services, NSW LRS Connect, Secure File Transfer, Information
    Broker Services with its own "API Service" child component, ITS Services, Document Delivery
    Services (DeX), RG Directions Website, Secure Upload Portal, DIIMS Services, Addressing
    Services, eCommerce, Portal Access, Cadastral Records Enquiry, HLRV, NOS Enquiry and Street
    Address searches. It confirms from the registry's own mouth that a production API service
    exists behind the broker licence, even though nothing about that API is published. No
    authentication, no key issuance and no rate limit is documented; the contract is Atlassian's,
    not NSW LRS's.
  humanURL: https://status.nswlrs.com.au/
  baseURL: https://status.nswlrs.com.au/api/v2
