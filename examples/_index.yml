  status: 200
  content_type: application/json
  note: >-
    Rollup status indicator for the whole NSW LRS estate. Documented endpoint on the NSW LRS status
    page API reference at https://status.nswlrs.com.au/api.
- file: nsw-land-registry-status-components.json
  api: nsw-lrs-status-api
  request: GET https://status.nswlrs.com.au/api/v2/components.json
  status: 200
  content_type: application/json
  note: >-
    The 27 published components and component groups NSW LRS reports on, including "API Service"
    under Information Broker Services, ITS Services, DIIMS Services, HLRV, eCommerce and the
    NSW LRS Connect and Online Portal groups. The component list is the closest public inventory
    of the NSW LRS production systems.
