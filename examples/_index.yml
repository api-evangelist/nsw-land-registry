- file: nsw-land-registry-hlrv-msearch-response.json
  api: nsw-lrs-hlrv-document-search-api
  request: >-
    POST https://api.lrsnative.com.au/hlrv/documents/_msearch with the ndjson body
    {"preference":"api-evangelist-probe"} / {"query":{"match_all":{}},"size":1}
  status: 200
  content_type: application/json
  note: >-
    One document from the 7,160,622-document historical index, showing the real field set
    (collectionId, collectionName, documentId, documentRenderingId, imageType, imageName,
    bookAndNumber, scanTimestamp and the images array of JPEG2000 files with fileName, location,
