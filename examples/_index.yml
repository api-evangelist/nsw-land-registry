source: live anonymous requests against the NSW LRS status page API and the HLRV search proxy
description: >-
  Real, unedited response bodies captured from the two NSW Land Registry Services surfaces that
  answer anonymously. Nothing here is synthesised: each file is the verbatim body a documented or
  observed endpoint returned on 2026-07-26, saved so an agent or integrator can see the actual
  response shape NSW LRS emits without having to call a registry that publishes no schema.
examples:
- file: nsw-land-registry-status-status.json
