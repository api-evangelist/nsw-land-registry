notes:
- >-
  The two undocumented public surfaces (the HLRV IIIF endpoint and the document search proxy) carry
  no versioning commitment of any kind and could change or close without notice; they are backends
  of a free public viewer, not products.
- >-
  Register access itself is licensed, so the practical lifecycle risk for an integrator is
  contractual (broker licence terms, HLRV terms of use) rather than technical.
