description: >-
  How NSW Land Registry Services versions, changes and reports on the systems behind the NSW
  Torrens Title Register. There is no API lifecycle policy because there is no public API
  programme; what exists instead is a regulated lodgment lifecycle with mandated cutover dates, a
  product release schedule for LRS Connect, and a genuinely good status page with a public API.
