findings:
  summary: |
    NSW Land Registry Services publishes no API. It has no developer portal, no
    developer or docs subdomain, no OpenAPI or Swagger document, no SDK, no CLI, no
    Postman workspace, no GitHub organization, no webhook catalogue and no published
    authentication scheme. Access to the Torrens Title Register is licensed, not
    opened: "Only an information broker we've authorised can access our records",
    and brokers reach it "through an official licence agreement with NSW LRS".
    Writes require ELNO subscriber registration with PEXA or Sympli under the
    Electronic Conveyancing National Law. Wholesale data products are sold by
    emailing datasolutions@nswlrs.com.au.

    Three real machine-readable surfaces nonetheless exist and answer anonymously,
    none of which NSW LRS documents. A Cantaloupe IIIF Image API 2.0 Level 2 endpoint
    serves the scanned historical land records and returns a valid self-describing
    info.json plus real JPEG derivatives. An Elasticsearch proxy at
    /hlrv/documents/_msearch answers with 7,160,622 indexed documents and no token.
    And a valid W3C XSD pinning the NSW ePlan LandXML jurisdictional vocabulary is
    published as an ordinary site asset. The contract is open and the licence is
    closed: the HLRV terms prohibit on-supply, republishing, data aggregation and
    "any device, software or routine to abuse the service of HLRV or emulate human
    interaction and operation".

    RESO is absent in every direction that can be checked, which is the expected
    Australian answer. No open data is published; NSW LRS is not an organization on
    data.nsw.gov.au. A privatised registry, operating a public statutory record under
    a 2017 concession, selling that record back through a licensed broker channel at
    AUD 19.49 to AUD 98.00 a search, is the finding — recorded plainly.
  publicDeveloperSurface: false
  machineReadableContractsHarvested: 2
  openApiDocumentsFound: 0
  gated: true

